name: Foundation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Electron binary and Xvfb for the native desktop shell test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          bun run --cwd apps/shell native:install
          # The Shell never disables the Chromium sandbox; Ubuntu 24.04 restricts
          # unprivileged user namespaces, so give Electron its setuid helper.
          sudo chown root:root apps/shell/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/shell/node_modules/electron/dist/chrome-sandbox
      - name: GEPA worker venv (gepa 0.1.4, Python 3.12) and worker tests
        working-directory: packages/optimization/python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements.lock
          .venv/bin/python -m pytest -q
      - name: Training worker stdlib tests (no torch; real run is opt-in)
        working-directory: packages/training/python
        run: python3 -m unittest discover -s tests -v
      - run: bun run check
        env:
          MARS_REQUIRE_ELECTRON_XVFB: "1"
      - run: bun run doctor
      - name: VS Code client typecheck, build and Node smoke
        working-directory: apps/vscode
        run: bun run typecheck && bun run smoke
